<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Vocal Query</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/site.css">
  <style>
    .login-wrap { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 24px 16px; }
    .login-card { width: 100%; max-width: 380px; padding: 32px 28px; box-shadow: var(--shadow); text-align: center; }
    .login-card h1 { font-size: 30px; margin: 0 0 6px; }
    .login-card p { margin: 0 0 20px; }
    .login-card input {
      width: 100%; padding: 11px 12px; margin-bottom: 12px; border-radius: var(--radius);
      border: 1px solid var(--border-strong); background: var(--surface); font: 400 14px var(--font); color: var(--text);
    }
    .login-card input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .login-card .btn { width: 100%; }
    .login-error { color: var(--red); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><img class="brand-mark" src="/logo.svg" alt="">Vocal Query</a>
  </nav>

  <main class="login-wrap">
    <form class="card login-card" id="login-form">
      <h1 class="display">Welcome back</h1>
      <p class="muted">Enter the password to talk to the database.</p>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus required>
      <button class="btn btn-primary" id="login-btn" type="submit">Log in</button>
      <p class="login-error" id="login-error"></p>
    </form>
  </main>

  <script src="/auth.js"></script>
  <script>
    const form = document.getElementById('login-form')
    const button = document.getElementById('login-btn')
    const error = document.getElementById('login-error')

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      error.textContent = ''
      button.disabled = true
      button.textContent = 'Checking...'
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      })
      if (res.ok) {
        // go back to where the user came from (only to our own pages)
        const next = new URLSearchParams(location.search).get('next')
        location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/import'
      } else {
        error.textContent = (await res.json()).error || 'Could not log in.'
        button.disabled = false
        button.textContent = 'Log in'
      }
    })
  </script>
</body>
</html>
