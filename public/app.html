<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace - Vocal Query</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body class="workspace">

  <!-- Thin icon rail on the far left -->
  <nav class="rail">
    <a href="/" class="rail-logo" title="Home"><img src="/logo.svg" alt="Vocal Query" width="24" height="24"></a>
    <button class="rail-btn active" data-tab="schema" title="Schema">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
    </button>
    <button class="rail-btn" data-tab="er" title="ER diagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/><path d="M6.5 9v4.5H17.5V15"/></svg>
    </button>
    <button class="rail-btn" data-tab="log" title="Query log">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <a href="/import" class="rail-btn rail-bottom" title="Import data">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
    </a>
  </nav>

  <!-- Tables sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <span>Tables</span>
      <button id="refresh-btn" class="icon-btn" title="Refresh">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
    <ul id="table-list" class="table-list"></ul>
  </aside>

  <!-- Center column -->
  <main class="center">
    <header class="topbar">
      <div class="crumbs"><span class="muted">Vocal Query</span><span class="sep">/</span><strong>Neon · production</strong></div>
      <span class="pill"><span class="dot"></span>Connected</span>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="schema">Schema</button>
      <button class="tab" data-tab="er">ER Diagram</button>
      <button class="tab" data-tab="log">Query log</button>
    </div>

    <div class="tab-body">
      <section id="view-schema" class="view"></section>
      <section id="view-er" class="view" hidden></section>
      <section id="view-log" class="view" hidden></section>
    </div>

    <!-- Results drawer: shows the rows of the last query -->
    <section id="results" class="results" hidden>
      <div class="results-head">
        <code id="results-sql" class="results-sql"></code>
        <span id="results-count" class="chip chip-blue"></span>
      </div>
      <div id="results-table" class="results-table"></div>
    </section>
  </main>

  <!-- AI chat panel -->
  <aside class="chat">
    <header class="chat-head">
      <div class="chat-title">
        <img src="/logo.svg" alt="" width="18" height="18">
        <strong>Vocal Query</strong>
        <span class="model-chip">Gemini 3.8 Live</span>
      </div>
      <span id="conn-status" class="conn" title="Not connected"><span class="dot"></span><span id="conn-text">Offline</span></span>
    </header>

    <div id="messages" class="messages">
      <div id="hint" class="hint">
        <p class="display hint-title">What would you like to know?</p>
        <p class="muted">Tap the orb and speak, or try one of these:</p>
        <button class="example">Show all customers</button>
        <button class="example">Which city has the most customers?</button>
        <button class="example">Total revenue per product</button>
        <button class="example">Add a customer named Neha from Jaipur</button>
      </div>
    </div>

    <div class="composer-wrap">
      <form id="composer" class="composer card">
        <textarea id="composer-input" rows="2" placeholder="Ask something or tap the orb"></textarea>
        <div class="composer-row">
          <span id="mic-note" class="mic-note"></span>
          <button type="submit" class="send-btn" title="Send">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
      </form>
      <div class="orb-area">
        <button id="orb" class="orb idle" title="Tap to talk" aria-label="Talk to your database"></button>
        <span id="orb-status" class="orb-status">Tap to talk</span>
      </div>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script src="/app.js"></script>
  <script src="/voice.js"></script>
</body>
</html>
